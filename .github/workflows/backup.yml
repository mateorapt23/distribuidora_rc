name: Respaldo diario de base de datos

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Generar dump de la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          fecha=$(date +'%Y-%m-%d_%H-%M')
          docker run --rm -v "$PWD":/backup postgres:18 pg_dump "$DATABASE_URL" -F c -f "/backup/backup_${fecha}.dump"

      - name: Subir respaldo como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-distribuidora-rc
          path: backup_*.dump
          retention-days: 30